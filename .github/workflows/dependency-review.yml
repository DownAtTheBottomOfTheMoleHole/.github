---
# Reusable Dependency Review workflow — DownAtTheBottomOfTheMoleHole
#
# Call from another repo (triggers automatically on pull_request in calling repo):
#   jobs:
#     dependency-review:
#       uses: DownAtTheBottomOfTheMoleHole/.github/.github/workflows/dependency-review.yml@main
#       secrets: inherit
#       permissions:
#         contents: read
#         pull-requests: write

name: 🔐 Dependency Review

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔐 Review Dependencies
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          warn-only: false
