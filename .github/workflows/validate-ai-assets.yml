name: Validate AI assets

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install validation dependencies
        run: python3 -m pip install -r tools/requirements-dev.txt
      - name: Validate metadata, links and discovery
        run: python3 tools/validate_ai_assets.py
      - name: Run offline regression tests
        run: python3 -m unittest discover -s tests -v
